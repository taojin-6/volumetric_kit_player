name: ci

# Build and test on the family's self-hosted GPU runners, lint on a hosted one,
# and one hosted `required` gate over both (DECISIONS.md, 2026-10-18).
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running CI. A push to main never cancels a
# running main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only the owner triggers this repository's workflows, so no job carries a fork
# guard (the core's DECISIONS.md, "Only the owner triggers CI").
jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.build_type }}${{ matrix.tsan && ', TSan' || '' }})
    runs-on: [self-hosted, '${{ matrix.runner }}']
    # The Linux legs pull their image from the core's GHCR package.
    permissions:
      contents: read
      packages: read
    # The Linux legs run in a job container of the family's CI image for
    # their release (the core's tools/ci/images), which holds everything they
    # build and test with, with the GPU passed through: the image's only
    # Vulkan driver is the ICD the toolkit mounts for
    # NVIDIA_DRIVER_CAPABILITIES=all. Each image is pinned by digest, the tag
    # it was read from in a comment, so a new image comes only with a commit
    # that moves the pin. The token can be named only under `credentials`, so
    # the container is a mapping; an empty image, the Mac legs', runs the job
    # on the host.
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --gpus all
      # A runner's .env does not reach a job container, so the container sets
      # the build and test levels: 4 is a 24-core host over a repository's 6
      # runners. It also puts the NVIDIA driver's shader cache in the
      # runner's tool cache, which outlives a job: the driver's default,
      # $HOME/.cache, is missing from the container, and with no cache every
      # process compiles every pipeline.
      env:
        NVIDIA_DRIVER_CAPABILITIES: all
        CMAKE_BUILD_PARALLEL_LEVEL: '4'
        CTEST_PARALLEL_LEVEL: '4'
        __GL_SHADER_DISK_CACHE_PATH: /__w/_tool/nvidia-glcache
        __GL_SHADER_DISK_CACHE_SKIP_CLEANUP: '1'
    timeout-minutes: 30
    defaults:
      run:
        # A container runs `run:` steps under `sh` (dash) by default.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            runner: mac
            build_type: Release
            image: ''
          # ThreadSanitizer, for StreamPlayer's worker (DECISIONS.md, CI), in
          # Debug: the Mac's one Debug leg (DECISIONS.md, 2026-10-30).
          - os: macos-26
            runner: mac
            build_type: Debug
            tsan: true
            image: ''
          - os: ubuntu-24.04
            runner: vk-linux-gpu
            build_type: Release
            # ghcr.io/taojin-6/volumetric_kit_ci:ubuntu-24.04
            image: ghcr.io/taojin-6/volumetric_kit_ci@sha256:14e18e23ec99fc77cb671722ec9d0f5774e124951c047f67731740441234fd6b
          - os: ubuntu-26.04
            runner: vk-linux-gpu
            build_type: Release
            # ghcr.io/taojin-6/volumetric_kit_ci:ubuntu-26.04
            image: ghcr.io/taojin-6/volumetric_kit_ci@sha256:b39be8613b4e8140a45c98cfc23bb1f40f98300d213fdab901c3108f02df626e
    steps:
      # The shader cache directory the container env names is made here: the
      # driver creates nothing above its own GLCache, and the image cannot
      # hold it, as /__w is mounted at run time.
      - name: Shader cache directory (Linux)
        if: runner.os == 'Linux'
        run: mkdir -p "$__GL_SHADER_DISK_CACHE_PATH"

      # A self-hosted workspace is readable by other repositories' jobs on the
      # host, so the token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Mac's Homebrew is shared, so a job installs nothing and fails
      # naming any formula missing (the core's tools/runners/README.md). The
      # formulae are named once, here, for the key below.
      # TODO: take this check from a core action, as gfx, recon and calib copy
      # it too, once the core has one.
      - name: Check dependencies (macOS)
        id: formulae
        if: runner.os == 'macOS'
        run: |
          pkgs="cmake glm molten-vk vulkan-headers vulkan-loader"
          pkgs="$pkgs vulkan-validationlayers shaderc glslang spirv-tools glfw"
          echo "formulae=$pkgs" >> "$GITHUB_OUTPUT"
          command -v brew >/dev/null || {
            echo "::error::brew is not on this runner's PATH"
            exit 1
          }
          missing=""
          for pkg in $pkgs; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error::install by hand on this runner's host, while CI is idle:${missing}"
            exit 1
          fi
          # The layer's manifest names its library without a path; the Test
          # step alone searches Homebrew's lib for it.
          echo "VP_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # The installed versions of those formulae and of all they depend on,
      # for the dependency cache's key. The action is at the core pin
      # (third_party/CMakeLists.txt): move it with that pin.
      - name: Homebrew key
        id: brew
        if: runner.os == 'macOS'
        uses: taojin-6/volumetric_kit_core/.github/actions/homebrew-key@c52a86ab8fcfd11fb6afbfeaf0ae9ef2209b18b2
        with:
          formulae: ${{ steps.formulae.outputs.formulae }}

      # The Linux legs exist for the GPU behind --gpus all, so they fail rather
      # than passing with no device.
      - name: GPU diagnostic (Linux)
        if: runner.os == 'Linux'
        run: |
          vulkaninfo --summary || {
            echo "::error::no Vulkan device visible inside the GPU container"
            exit 1
          }

      # Hashes of the workspace path and of the toolchain, for the dependency
      # cache's key: the machine and compiler, and on the Mac the macOS, Xcode
      # and SDK versions, on Linux the image's digest, which fixes every
      # package the dependencies build with.
      - name: Dependency cache key
        id: deps
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          fingerprint() {
            { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12
          }
          toolchain=$(
            uname -m
            c++ --version
            if [ "$RUNNER_OS" = macOS ]; then
              sw_vers -productVersion
              xcode-select -p
              xcrun --show-sdk-version
            else
              printf '%s\n' "$IMAGE"
            fi
          )
          ws=$(printf '%s' "$GITHUB_WORKSPACE" | fingerprint)
          tc=$(printf '%s' "$toolchain" | fingerprint)
          echo "ws=$ws" >> "$GITHUB_OUTPUT"
          echo "toolchain=$tc" >> "$GITHUB_OUTPUT"
          echo "workspace $GITHUB_WORKSPACE -> $ws, toolchain -> $tc:"
          echo "$toolchain"

      # The fetched siblings and googletest, sources and builds. The restore
      # prefix carries what make cannot see change, so no tree built on other
      # libraries, another toolchain or another path is restored; the pins and
      # this workflow end the key (DECISIONS.md, 2026-10-31).
      - name: Cache third-party deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ matrix.build_type }}${{ matrix.tsan && '-tsan' || '' }}-brew${{ steps.brew.outputs.key || 'none' }}-tc${{ steps.deps.outputs.toolchain }}-ws${{ steps.deps.outputs.ws }}-${{ hashFiles('third_party/CMakeLists.txt', 'CMakeLists.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            deps-${{ matrix.os }}-${{ matrix.build_type }}${{ matrix.tsan && '-tsan' || '' }}-brew${{ steps.brew.outputs.key || 'none' }}-tc${{ steps.deps.outputs.toolchain }}-ws${{ steps.deps.outputs.ws }}-

      - name: Configure
        # Retry to ride out transient FetchContent clone failures. The TSan leg
        # instruments every target, the siblings' and googletest's too, and
        # runs each test binary's cases in one process (DECISIONS.md, CI and
        # 2026-10-31).
        run: |
          sanitize=""
          if [ "${{ matrix.tsan }}" = true ]; then
            for flags in C_FLAGS CXX_FLAGS OBJCXX_FLAGS \
                EXE_LINKER_FLAGS SHARED_LINKER_FLAGS MODULE_LINKER_FLAGS; do
              sanitize="${sanitize} -DCMAKE_${flags}=-fsanitize=thread"
            done
            sanitize="${sanitize} -DVP_TEST_PER_BINARY=ON"
          fi
          ok=0
          for attempt in 1 2 3; do
            # ${sanitize} is unquoted, to split into its -D arguments.
            if cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DVP_WARNINGS_AS_ERRORS=ON ${sanitize}; then
              ok=1
              break
            fi
            echo "::warning::cmake configure attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          [ "${ok}" = 1 ] || {
            echo "::error::cmake configure failed after 3 attempts"
            exit 1
          }

      # The levels come from the runner's .env on the Mac and from the
      # container's env on Linux. They are passed explicitly: a bare
      # `--parallel` runs make with no job limit.
      - name: Build
        run: |
          cmake --build build \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      - name: Test
        env:
          # The core's test policy: a GPU test fails, rather than skips,
          # without a device or the validation layer, and fails on any error
          # the layer reports.
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
        # Set on the command, as macOS strips DYLD_* from a step's env when it
        # starts the system's bash. CI leaves out the `stress` soak, runs the
        # `consumer` builds on the ubuntu-26.04 leg alone, and the TSan leg
        # skips the view's rerun on MoltenVK's specialized families
        # (DECISIONS.md, CI and 2026-10-25).
        run: |
          labels="stress|consumer"
          if [ "${{ matrix.os }}" = ubuntu-26.04 ]; then
            labels="stress"
          fi
          skip=""
          if [ "${{ matrix.tsan }}" = true ]; then
            skip="-E vp_player_view_on_moltenvk_specialized"
          fi
          # ${skip} is unquoted, to split into its arguments.
          DYLD_FALLBACK_LIBRARY_PATH="${VP_LAYER_LIBRARY_PATH:-}" \
            ctest --test-dir build --output-on-failure -LE "${labels}" ${skip} \
              --parallel "${CTEST_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"
          # A binary's one test passes when a case skips, so name each skip.
          if [ "${{ matrix.tsan }}" = true ]; then
            { grep -ohE '^\[  SKIPPED \] [^ ]+\.[^ ]+' \
                build/Testing/Temporary/LastTest.log || true; } |
              cut -c14- | sort -u | awk '{print "::notice::skipped " $0}'
          fi

      # The worker's and the view's suites again under the layer's
      # synchronization validation, on the Release legs: NVIDIA's, the rings
      # copied (the view skips there), and the Mac's, in place and the view
      # across MoltenVK's two families (DECISIONS.md, 2026-10-25).
      - name: Test under synchronization validation
        if: matrix.build_type == 'Release'
        env:
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VKC_TEST_VALIDATION: '1'
          VKC_TEST_SYNC_VALIDATION: '1'
        run: |
          DYLD_FALLBACK_LIBRARY_PATH="${VP_LAYER_LIBRARY_PATH:-}" \
            ctest --test-dir build --output-on-failure \
              -R '^(StreamPlayerTest|LivePlayerTest|PlayerViewTest)\.' \
              --parallel "${CTEST_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      # The iOS app (DECISIONS.md), built Release, as it ships, and unsigned
      # (no team) from the sources the configure above fetched, on MoltenVK's
      # iOS release, which the runner's .env names. It must be an iOS binary
      # that loads only the system's libraries (MoltenVK and the siblings link
      # statically), for iPhone and iPad.
      - name: iOS app build (macOS)
        if: runner.os == 'macOS' && matrix.build_type == 'Release'
        run: |
          [ -n "${MoltenVK_ROOT:-}" ] || {
            echo "::error::MoltenVK_ROOT is not set: run the core's setup-runners.sh with it (its tools/runners/README.md)"
            exit 1
          }
          # The dependencies the configure above fetched, by its cache: a
          # restored tree may hold others, which a pin no longer names.
          flags=()
          for dep in $(sed -n 's/^FETCHCONTENT_UPDATES_DISCONNECTED_\([^:]*\):.*/\1/p' \
              build/CMakeCache.txt); do
            src="$PWD/build/_deps/$(printf '%s' "$dep" | tr '[:upper:]' '[:lower:]')-src"
            flags+=("-DFETCHCONTENT_SOURCE_DIR_${dep}=${src}")
          done
          rm -rf build-ios
          cmake --preset ios "${flags[@]}"
          cmake --build build-ios --config Release --target volumetric_kit_player
          app=build-ios/apps/ios/Release-iphoneos/volumetric_kit_player.app/volumetric_kit_player
          platform=$(otool -l "$app" |
            awk '/LC_BUILD_VERSION/{f=1} f&&$1=="platform"{print $2; f=0}')
          if [ "$platform" != 2 ]; then
            echo "::error::$app is not an iOS binary (LC_BUILD_VERSION platform ${platform:-none}, not 2)"
            exit 1
          fi
          others=$(otool -L "$app" | tail -n +2 | awk '{print $1}' |
            grep -vE '^(/System/Library/|/usr/lib/)' || true)
          if [ -n "$others" ]; then
            echo "::error::$app loads libraries the system does not have:" $others
            exit 1
          fi
          family=$(plutil -extract UIDeviceFamily json -o - \
            "$(dirname "$app")/Info.plist" 2>/dev/null || true)
          if [ "$family" != '[1,2]' ]; then
            echo "::error::$app's UIDeviceFamily is ${family:-missing}, not [1,2] (iPhone and iPad)"
            exit 1
          fi

      # The window's smoke run (DECISIONS.md): the app plays the tests'
      # stream, which the Test step wrote, under Xvfb for 60 presents of a
      # stream frame, as a scenario says. The loader forces the validation
      # layer on, which a Release build does not ask for, and logs the
      # insert; with no messenger, the layer prints its own messages. Then
      # vp_desktop_hooks plays it the same way through run_desktop, with
      # hooks of its own that must be made once and run.
      - name: Smoke run of the window (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          set -eo pipefail
          cat > build/smoke.json <<'EOF'
          {
            "version": 1,
            "operation": "view",
            "source": { "kind": "stream", "path": "tests/streams/sphere.vrst" },
            "run": { "frames": 60 }
          }
          EOF
          VK_LOADER_LAYERS_ENABLE='*validation' VK_LOADER_DEBUG=layer \
            timeout 300 xvfb-run -a \
              build/apps/volumetric_kit_player/volumetric_kit_player \
              --config build/smoke.json 2>&1 | tee build/smoke.log
          if ! grep -qE '^volumetric_kit_player: presented 60 frame\(s\), drew stream frame [0-9]+$' \
              build/smoke.log; then
            echo "::error::the window did not present 60 frames of the stream"
            exit 1
          fi
          if ! grep -qF 'Insert instance layer "VK_LAYER_KHRONOS_validation"' \
              build/smoke.log; then
            echo "::error::the validation layer did not load"
            exit 1
          fi
          if grep -q 'VUID-' build/smoke.log; then
            echo "::error::Vulkan validation errors from the window"
            exit 1
          fi
          VK_LOADER_LAYERS_ENABLE='*validation' \
            timeout 300 xvfb-run -a build/tests/vp_desktop_hooks \
              --config build/smoke.json 2>&1 | tee build/smoke_hooks.log
          if ! grep -qE '^vp_desktop_hooks: made 1, after_mesh [1-9][0-9]*, before_draw [1-9][0-9]*$' \
              build/smoke_hooks.log; then
            echo "::error::a program's hooks did not run in the window"
            exit 1
          fi
          if grep -q 'VUID-' build/smoke_hooks.log; then
            echo "::error::Vulkan validation errors from the window with hooks"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No job pushes, so no checkout keeps a token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No workflow is triggered by an event an outsider can cause, or by a
      # schedule (the core's tools/runners/README.md, "Who can trigger CI").
      # The action is at the core pin in third_party/CMakeLists.txt.
      - uses: taojin-6/volumetric_kit_core/.github/actions/check-workflow-triggers@c52a86ab8fcfd11fb6afbfeaf0ae9ef2209b18b2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      # pre-commit's hook environments, rebuilt only when the config changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-
      # Pinned, so a new pre-commit release cannot change the gate unseen.
      - run: python -m pip install pre-commit==4.6.2
      - run: pre-commit run --all-files --show-diff-on-failure

  required:
    # The one check for branch protection (its context is `required`). It
    # passes only when every build leg and lint succeeded, and FAILS (never
    # skips) on any other outcome: a skipped required check never reports. It
    # runs hosted, so it never queues for a runner itself (DECISIONS.md).
    needs: [build, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }} lint=${{ needs.lint.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
